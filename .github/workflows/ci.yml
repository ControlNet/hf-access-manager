name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test:
    name: Test, Lint & Build
    runs-on: ubuntu-latest

    env:
      HF_TOKEN: "hf_ci_dummy_token_12345"
      HF_REPOSITORIES: "model:meta-llama/Llama-2-7b,dataset:VL4AI/SpatialBench"
      APP_PASSWORD: "ci-dummy-password-at-least-16-chars"
      AUTH_SECRET: "ci-dummy-auth-secret-key-at-least-32-characters"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js application
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: hf-access-manager:ci
